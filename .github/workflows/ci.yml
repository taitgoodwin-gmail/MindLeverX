name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - codex/public-functionality-20261001

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - name: Install PDF runtime
        run: python3 -m pip install --requirement requirements-pdf.txt
      - name: Run application checks
        run: npm run check
      - name: Run requirements checks
        run: npm run check:requirements
      - name: Build public artifact
        run: npm run build:public
      - name: Run public regression and boundary tests
        run: node --test tests/public-ui/*.test.mjs
